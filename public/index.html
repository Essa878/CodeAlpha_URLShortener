<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem;
      line-height: 1.5;
    }
    h1 { margin-bottom: .25rem; }
    p.sub { margin-top: 0; color: #888; }
    form { display: flex; gap: .5rem; margin: 1.5rem 0; }
    input[type=url] {
      flex: 1; padding: .7rem .9rem; font-size: 1rem;
      border: 1px solid #ccc; border-radius: 8px;
    }
    button {
      padding: .7rem 1.2rem; font-size: 1rem; cursor: pointer;
      border: 0; border-radius: 8px; background: #2563eb; color: #fff;
    }
    button:hover { background: #1d4ed8; }
    .result {
      display: none; padding: 1rem; margin-bottom: 1.5rem;
      border: 1px solid #2563eb; border-radius: 8px;
    }
    .result a { font-weight: 600; font-size: 1.1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
    th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid #ddd; font-size: .9rem; }
    td.url { max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .error { color: #dc2626; }
    .empty { color: #888; }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <p class="sub">Paste a long URL to get a short one.</p>

  <form id="shorten-form">
    <input id="long-url" type="url" placeholder="https://example.com/some/very/long/path" required />
    <button type="submit">Shorten</button>
  </form>

  <div class="result" id="result"></div>

  <h2>Recent links</h2>
  <table>
    <thead>
      <tr><th>Short URL</th><th>Original</th><th>Clicks</th></tr>
    </thead>
    <tbody id="list">
      <tr><td colspan="3" class="empty">Loading…</td></tr>
    </tbody>
  </table>

  <script>
    const form = document.getElementById('shorten-form');
    const input = document.getElementById('long-url');
    const result = document.getElementById('result');
    const list = document.getElementById('list');

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    async function loadList() {
      const res = await fetch('/api/urls');
      const rows = await res.json();
      if (!rows.length) {
        list.innerHTML = '<tr><td colspan="3" class="empty">No links yet.</td></tr>';
        return;
      }
      list.innerHTML = rows.map((r) => `
        <tr>
          <td><a href="${escapeHtml(r.shortUrl)}" target="_blank" rel="noopener">${escapeHtml(r.shortCode)}</a></td>
          <td class="url" title="${escapeHtml(r.longUrl)}">${escapeHtml(r.longUrl)}</td>
          <td>${r.clicks}</td>
        </tr>`).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      result.style.display = 'none';
      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ longUrl: input.value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong');
        result.innerHTML = `Short URL: <a href="${escapeHtml(data.shortUrl)}" target="_blank" rel="noopener">${escapeHtml(data.shortUrl)}</a>`;
        result.classList.remove('error');
        result.style.display = 'block';
        input.value = '';
        loadList();
      } catch (err) {
        result.textContent = err.message;
        result.classList.add('error');
        result.style.display = 'block';
      }
    });

    loadList();
  </script>
</body>
</html>
